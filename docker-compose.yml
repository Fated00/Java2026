services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autosalon
      POSTGRES_USER: autosalon
      POSTGRES_PASSWORD: autosalon
    ports:
      - "5435:5432"
    volumes:
      - autosalon-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autosalon -d autosalon"]
      interval: 5s
      timeout: 5s
      retries: 10

  autosalon-app:
    image: autosalon-backend-lab1:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/autosalon
      SPRING_DATASOURCE_USERNAME: autosalon
      SPRING_DATASOURCE_PASSWORD: autosalon
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  autosalon-postgres-data:
